version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: receipts_postgres
    environment:
      POSTGRES_USER: receipts_user
      POSTGRES_PASSWORD: receipts_pass
      POSTGRES_DB: receipts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
